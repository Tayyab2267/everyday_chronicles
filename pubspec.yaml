name: everyday_chronicles
description: everyday chronicles is an automated personal digital diary app

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_lints: ^3.0.1
  google_fonts: ^4.0.4
  get: ^4.6.6
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^1.1.0
  flutter_otp_text_field: ^1.1.1
  shared_preferences: ^2.2.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  persistent_bottom_nav_bar_v2: ^5.0.0
  persistent_bottom_nav_bar: ^5.0.2
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.0.7
  line_awesome_flutter: ^2.0.0
  syncfusion_flutter_charts: ^23.2.7
  fl_chart: ^0.66.2

  permission_handler: ^11.0.0
  telephony: ^0.2.0
  intl: ^0.18.0
  http: ^1.2.0
  geolocator: ^8.2.1
  geocoding: ^3.0.0
  lottie: ^3.1.0

  cloud_firestore: ^4.13.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  workmanager: ^0.5.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21


flutter:

  uses-material-design: true

  assets:
    - assets/images/app-icon.png
    - assets/images/icon-dark.png
    - assets/images/
    - assets/images/profile/
    - assets/images/on_boarding_images/
    - assets/images/welcome_images/
    - assets/images/login_signup_images/
    - assets/images/logo/
    - assets/images/forget_password_images/
    - assets/images/card_images/
